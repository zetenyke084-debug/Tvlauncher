name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fajlok listazasa
        run: find . -not -path './.git/*' | head -60
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build debug APK
        run: |
          F=$(find . -name settings.gradle.kts | head -n 1)
          if [ -z "$F" ]; then echo "Nincs settings.gradle.kts a repoban!"; exit 1; fi
          DIR=$(dirname "$F")
          echo "Projekt mappa: $DIR"
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher-apk
          path: "**/app-debug.apk"
