name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip kicsomagolása
        run: |
          mkdir -p proj
          for z in *.zip; do
            if unzip -l "$z" | grep -q "logo_apple_music.xml"; then
              echo "Találat: $z"
              unzip -oq "$z" -d proj
            fi
          done
          find proj -name settings.gradle.kts
      - name: APK építése
        run: |
          DIR=$(dirname "$(find proj -name settings.gradle.kts | head -n 1)")
          cd "$DIR"
          gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher-apk
          path: proj/**/app-debug.apk
