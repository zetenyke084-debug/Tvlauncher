name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Zip kicsomagolása
        run: unzip -oq TvLauncheER.zip -d proj
      - name: APK építése
        working-directory: proj/TvLauncher
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: TvLauncher-apk
          path: proj/TvLauncher/app/build/outputs/apk/debug/app-debug.apk
